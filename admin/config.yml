backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "products"
    label: "Product Catalog"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name", name: "name", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["T-Shirt", "Mug", "Frame", "Cushion", "Cap", "Tiles"] }
      - { label: "Price (₹)", name: "price", widget: "number" }
      - { label: "Product Photo", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }

